<!-- End Google Tag Manager (noscript) --><header class="product-header"><button class="menu" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button><nav class="product-nav" aria-label="Primary"><button class="nav-close" type="button" aria-label="Close navigation">×</button><a href="/#included">About</a><a href="/#pricing">Pricing</a><a href="/#how">How It Works</a><a href="/case-studies">Case Studies</a><a href="/#faq">Support</a><a href="/visibility-check">Free AI Check</a><a href="/login">Customer Login</a></nav><a class="brand" href="/" aria-label="UNIRAB home"><span>UNI</span><b>RAB</b><i></i></a></header><main class="login-main" id="main"><div class="login-card">
<h1 id="card-title">Log in</h1>
<p id="card-sub">Access your UNIRAB client portal.</p>

<a id="google-btn" class="oauth-btn" href="/api/auth?action=google"><svg class="google-g" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#1976D2" d="M6.306 14.691l6.571 4.849C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#FF3D00" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#4CAF50" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>Continue with Google</a>
<div class="login-divider" id="divider">OR</div>

<form class="login-form" id="pw-form" novalidate>
  <label for="login-name" id="name-label" hidden>Your name (optional)</label>
  <div class="field-wrap" id="name-wrap" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input id="login-name" name="name" autocomplete="name" class="has-ic" placeholder="Your name"></div>
  <label for="login-email">Email address</label>
  <div class="field-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><input id="login-email" name="email" type="email" autocomplete="email" class="has-ic" placeholder="you@example.com" required></div>
  <label for="login-password" id="pw-label">Password</label>
  <div class="field-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="login-password" name="password" type="password" autocomplete="current-password" class="has-ic" placeholder="Your password" required></div>
  <div id="confirm-wrap" hidden>
    <label for="login-confirm">Confirm password</label>
    <div class="field-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input id="login-confirm" name="confirm" type="password" autocomplete="new-password" class="has-ic" placeholder="Repeat your password"></div>
  </div>
  <button type="submit" id="pw-submit">Log in</button>
  <p class="login-status" id="pw-status" aria-live="polite"></p>
</form>

<form class="login-form" id="magic-form" hidden novalidate>
  <label for="magic-email">Your email address</label>
  <div class="field-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><input id="magic-email" name="email" type="email" autocomplete="email" class="has-ic" placeholder="you@example.com" required></div>
  <button type="submit">Send link</button>
  <p class="login-status" id="magic-status" aria-live="polite"></p>
</form>

<div class="mode-row" id="mode-row"><span id="mode-text">New here?</span> <button type="button" id="mode-toggle">Create an account</button></div>
<span class="alt-link" id="magic-toggle" role="button" tabindex="0">Prefer a magic link? Email me a sign-in link</span>
</div></main><script>
const menu=document.querySelector('.menu'),nav=document.querySelector('.product-nav');menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))});nav?.addEventListener('click',e=>{if(e.target.matches('a')||e.target.closest('.nav-close')){nav.classList.remove('open');menu.setAttribute('aria-expanded','false')}});document.addEventListener('click',e=>{if(nav&&nav.classList.contains('open')&&!nav.contains(e.target)&&!menu.contains(e.target)){nav.classList.remove('open');menu.setAttribute('aria-expanded','false')}});
const params=new URLSearchParams(location.search);
const $=s=>document.querySelector(s);
const statusOf=id=>$(id);
if(params.get('error')){statusOf('#pw-status').classList.add('error');statusOf('#pw-status').textContent=params.get('error')}
let mode='login';
function paint(){
  const reg=mode==='register',magic=mode==='magic';
  $('#card-title').textContent=magic?'Magic link login':reg?'Create your account':'Log in';
  $('#card-sub').textContent=magic?'We will email you a one-time link to open your portal.':reg?'Use your email and a password - we will send you a confirmation link to activate it.':'Access your UNIRAB client portal.';
  $('#pw-form').hidden=magic;$('#magic-form').hidden=!magic;
  $('#name-wrap').hidden=!reg;$('#name-label').hidden=!reg;$('#confirm-wrap').hidden=!reg;
  $('#pw-submit').textContent=reg?'Create account':'Log in';
  $('#login-password').setAttribute('autocomplete',reg?'new-password':'current-password');
  $('#mode-text').textContent=magic?'':reg?'Already have an account?':'New here?';
  $('#mode-toggle').textContent=magic?'Use a password instead':reg?'Log in':'Create an account';
  $('#magic-toggle').textContent=magic?'Use email and password instead':'Prefer a magic link? Email me a sign-in link';
  $('#magic-toggle').style.display=magic?'none':'block';
}
$('#mode-toggle').addEventListener('click',()=>{mode=mode==='register'?'login':'register';paint()});
$('#magic-toggle').addEventListener('click',()=>{mode=mode==='magic'?'login':'magic';paint()});
$('#magic-toggle').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}});
paint();
async function post(url,body,btn){try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Something went wrong.');return result}catch(error){if(btn){btn.disabled=false;btn.textContent=mode==='register'?'Create account':'Log in'}throw error}}
$('#pw-form').addEventListener('submit',async event=>{event.preventDefault();const st=$('#pw-status');st.classList.remove('error');st.textContent='';const email=$('#login-email').value.trim(),password=$('#login-password').value,name=$('#login-name').value.trim();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){st.classList.add('error');st.textContent='Please enter a valid email address.';return}
if(mode==='register'){
  if(password.length<8){st.classList.add('error');st.textContent='Password must be at least 8 characters.';return}
  if(password!==$('#login-confirm').value){st.classList.add('error');st.textContent='Passwords do not match.';return}
  const btn=$('#pw-submit');btn.disabled=true;btn.textContent='Creating…';
  try{const result=await post('/api/auth?action=register',{email,password,name},btn);st.textContent=result.message||'Check your inbox to activate your account.'}catch(error){st.classList.add('error');st.textContent=error.message}
}else{
  if(!password){st.classList.add('error');st.textContent='Enter your password.';return}
  const btn=$('#pw-submit');btn.disabled=true;btn.textContent='Logging in…';
  try{const result=await post('/api/auth?action=login',{email,password},btn);window.location.href=result.redirect}catch(error){st.classList.add('error');st.textContent=error.message}
}});
$('#magic-form').addEventListener('submit',async event=>{event.preventDefault();const st=$('#magic-status');const email=$('#magic-email').value.trim();st.classList.remove('error');st.textContent='';
if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){st.classList.add('error');st.textContent='Please enter a valid email address.';return}
const btn=$('#magic-form button');btn.disabled=true;btn.textContent='Sending…';
try{const response=await fetch('/api/send-magic-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'Could not send the login email.');st.textContent='If an account exists for that email, we sent you a login link. It expires in 15 minutes.'}catch(error){st.classList.add('error');st.textContent=error.message}finally{btn.disabled=false;btn.textContent='Send link'}});
// Hide the Google option until it is configured (GOOGLE_CLIENT_ID/SECRET env).
fetch('/api/auth?action=status').then(r=>r.json()).then(s=>{if(!s.google){$('#google-btn').style.display='none';$('#divider').style.display='none'}}).catch(()=>{});
</script><script src="/session-widget.js" defer></script>
</body></html>
